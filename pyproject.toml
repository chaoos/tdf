[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tdf"
version = "0.1.0"
description = "Temporal determinant factorization for the 2D Schwinger model"
requires-python = ">=3.10"
dependencies = [
    "jax[cuda12]",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tdf*"]
